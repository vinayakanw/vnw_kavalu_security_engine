name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"   # Tuesdays 03:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    # CodeQL is free for public repositories. While the repository is private
    # (without GitHub Advanced Security) the upload step would fail, so skip it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
