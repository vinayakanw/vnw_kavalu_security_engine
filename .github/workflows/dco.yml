name: DCO

# Every commit in a pull request must carry a "Signed-off-by:" line.
# See CONTRIBUTING.md ("Developer Certificate of Origin").

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
